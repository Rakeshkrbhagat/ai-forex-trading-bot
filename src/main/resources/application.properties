# --- Server ---
# Render (and most PaaS) inject the listen port via $PORT; fall back to 8080 locally.
server.port=${PORT:8080}
server.address=0.0.0.0

# --- Google Gemini REST API ---
# API key is read from the GEMINI_API_KEY environment variable (never hardcode secrets).
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
# Model must be one currently served on the v1beta generateContent endpoint.
# Older names like gemini-1.5-flash now return 404 NOT_FOUND. Override with GEMINI_MODEL.
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.timeout-seconds=30

# --- Dashboard Authentication ---
# Credentials are read from the AUTH_USERNAME / AUTH_PASSWORD environment
# variables; the values after ':' are development fallbacks only.
auth.username=${AUTH_USERNAME:admin}
auth.password=${AUTH_PASSWORD:changeme}
# Bearer token lifetime (minutes). Default 7 days (10080) so the dashboard does
# not auto-logout with "Missing or invalid bearer token" during normal use.
auth.token-ttl-minutes=${AUTH_TOKEN_TTL_MINUTES:10080}
# Optional explicit secret for signing stateless bearer tokens. Leave unset to
# derive a stable secret from the credentials (tokens then survive restarts).
auth.token-secret=${AUTH_TOKEN_SECRET:}

# --- MT5 / The5ers Execution Bridge ---
# Set execution.enabled=false to log orders without dispatching to MT5.
execution.enabled=${EXECUTION_ENABLED:true}
execution.bridge-url=${MT5_BRIDGE_URL:http://localhost:8090}
execution.api-key=${MT5_BRIDGE_API_KEY:}
execution.default-volume-lots=${EXECUTION_VOLUME_LOTS:0.01}
execution.stop-loss-pips=${EXECUTION_SL_PIPS:20}
execution.take-profit-pips=${EXECUTION_TP_PIPS:40}
execution.max-slippage-points=${EXECUTION_MAX_SLIPPAGE:20}
execution.magic-number=${EXECUTION_MAGIC:555000}
execution.timeout-seconds=${EXECUTION_TIMEOUT:15}
# Transport to reach the bridge: auto | ws | rest.
#  - auto: use the WebSocket tunnel when a bridge is connected (cloud), else REST.
#  - ws:   always multiplex quotes/candles/orders over the bridge WebSocket.
#  - rest: always use outbound REST to execution.bridge-url (local dev only).
execution.transport=${EXECUTION_TRANSPORT:auto}

# --- Autonomous LLM Agent ---
# Delay between autonomous market-data ingestion cycles (milliseconds).
agent.poll-interval-ms=${AGENT_POLL_INTERVAL_MS:30000}
agent.initial-delay-ms=${AGENT_INITIAL_DELAY_MS:10000}
# Candle window fed to the LLM each cycle (richer than a single tick).
agent.timeframe=${AGENT_TIMEFRAME:M15}
agent.candles=${AGENT_CANDLES:100}
# After an HTTP 429 (quota / rate limit) pause LLM calls for this many seconds
# instead of hammering the API (which only worsens the quota problem).
ai.rate-limit-cooldown-seconds=${AI_RATE_LIMIT_COOLDOWN_SECONDS:60}
# Minimum spacing between ANY two outgoing LLM calls. Caps the request rate no
# matter how many symbols/cycles run so the bot stays under free-tier limits.
# Default 60000ms = one API call per minute.
ai.min-request-interval-ms=${AI_MIN_REQUEST_INTERVAL_MS:60000}
# Minimum AI confidence required to actually place a trade. Lower-conviction
# signals are downgraded to HOLD so the bot trades like a disciplined human
# (only high-probability setups) instead of on every candle.
ai.min-confidence=${AI_MIN_CONFIDENCE:0.65}

# --- Strategy mode ---
# RULES = built-in indicator strategy (EMA/RSI/ATR), NO API key, no AI errors.
# LLM   = use the AI provider (needs API key).
strategy.mode=${STRATEGY_MODE:RULES}
strategy.atr-sl-multiplier=${STRATEGY_ATR_SL:1.5}
strategy.reward-risk=${STRATEGY_RR:2.0}

# --- Logging (observability for manual testing) ---
# Set LOG_LEVEL_FOREXBOT=DEBUG to see every pipeline stage, or keep INFO.
logging.level.com.forexbot=${LOG_LEVEL_FOREXBOT:INFO}

